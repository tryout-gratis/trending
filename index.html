<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tren Penelusuran Google</title>
</head>
<body>
  <h2>10 Kueri Terpopuler</h2>
  <ol id="top-queries"></ol>

  <h2>10 Kueri yang Makin Populer</h2>
  <ol id="rising-queries"></ol>

  <script>
    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        const topList = document.getElementById('top-queries');
        const risingList = document.getElementById('rising-queries');

        // Tampilkan 10 Kueri Terpopuler
        data.top.forEach(query => {
          topList.innerHTML += `<li>${query}</li>`;
        });

        // Tampilkan 10 Kueri yang Makin Populer
        data.rising.forEach(query => {
          risingList.innerHTML += `<li>${query}</li>`;
        });
      })
      .catch(err => console.error('Gagal memuat data:', err));
  </script>
</body>
</html>
