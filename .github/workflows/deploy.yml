name: Fetch Google Trends & Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 */6 * * *' # Berjalan otomatis setiap 6 jam
  workflow_dispatch: # Akses tombol manual di tab Actions

# Mengatur izin token GitHub untuk dipublikasikan ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Menghindari bentrokan deployment jika ada beberapa proses bersamaan
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # JOB 1: BUILD (Fetch Data & Prepare Artifact)
  # -------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytrends pandas

      - name: Fetch Trends Data
        run: python fetch_trends.py

      - name: Upload Artifact for Deployment
        uses: actions/upload-pages-artifact@v3
        with:
          # Mengunggah seluruh root direktori (termasuk index.html & data.json)
          path: '.'

  # -------------------------------------------------------------
  # JOB 2: DEPLOY (Publish to GitHub Pages)
  # -------------------------------------------------------------
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
